<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9be26a"/>
      <stop offset="52%" stop-color="#79cd4e"/>
      <stop offset="100%" stop-color="#69bd43"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2c77f"/>
      <stop offset="100%" stop-color="#dfa05a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65d0ef"/>
      <stop offset="100%" stop-color="#2d9fd0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#315a28" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grid" width="108" height="108" patternUnits="userSpaceOnUse">
      <rect width="108" height="108" fill="#80cf53"/>
      <rect width="54" height="54" fill="#8bd75d" opacity=".58"/>
      <rect x="54" y="54" width="54" height="54" fill="#8bd75d" opacity=".58"/>
    </pattern>
    <g id="flower">
      <circle cx="0" cy="-7" r="6" fill="#fff8ed"/>
      <circle cx="7" cy="0" r="6" fill="#fff8ed"/>
      <circle cx="0" cy="7" r="6" fill="#fff8ed"/>
      <circle cx="-7" cy="0" r="6" fill="#fff8ed"/>
      <circle cx="0" cy="0" r="5" fill="#f6b632"/>
    </g>
    <g id="clover">
      <ellipse cx="-7" cy="0" rx="10" ry="7" fill="#4eac43"/>
      <ellipse cx="7" cy="0" rx="10" ry="7" fill="#61bd4c"/>
      <ellipse cx="0" cy="-8" rx="10" ry="7" fill="#70c855"/>
      <path d="M0 3 C3 10 2 16 -2 22" fill="none" stroke="#2e8537" stroke-width="3"/>
    </g>
    <g id="bush">
      <circle cx="-22" cy="2" r="22" fill="#4aa542"/>
      <circle cx="0" cy="-10" r="27" fill="#65bb4b"/>
      <circle cx="24" cy="3" r="22" fill="#52ad45"/>
      <circle cx="3" cy="14" r="26" fill="#3f983a"/>
      <circle cx="-7" cy="-18" r="8" fill="#8cdb61" opacity=".65"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#grass)"/>

  <!-- distant top garden -->
  <path d="M0 0H900V250C820 220 760 238 690 205C615 170 550 210 480 185C385 150 305 204 230 176C155 148 95 180 0 150Z" fill="#62ad42"/>
  <path d="M0 0H900V130C760 90 690 132 575 94C470 58 400 106 300 83C185 56 110 100 0 70Z" fill="#4d963c"/>
  <g opacity=".95">
    <use href="#bush" transform="translate(45 205) scale(1.45)"/>
    <use href="#bush" transform="translate(125 190) scale(1.25)"/>
    <use href="#bush" transform="translate(785 192) scale(1.35)"/>
    <use href="#bush" transform="translate(860 215) scale(1.5)"/>
  </g>

  <!-- wooden fence top -->
  <g fill="#9f6b3f" stroke="#73472a" stroke-width="5">
    <rect x="45" y="225" width="810" height="24" rx="10"/>
    <rect x="80" y="184" width="28" height="86" rx="8"/>
    <rect x="200" y="190" width="28" height="80" rx="8"/>
    <rect x="675" y="190" width="28" height="80" rx="8"/>
    <rect x="790" y="184" width="28" height="86" rx="8"/>
  </g>

  <!-- left cottage -->
  <g filter="url(#shadow)" transform="translate(18 255)">
    <path d="M20 95 L115 22 L205 92 V210 H20Z" fill="#f0d8a3" stroke="#9d6e45" stroke-width="6"/>
    <path d="M5 95 L112 10 L220 92 L198 108 L112 44 L27 111Z" fill="#6aa3cb" stroke="#47789c" stroke-width="6"/>
    <rect x="86" y="137" width="52" height="73" rx="8" fill="#a56f43" stroke="#6f452c" stroke-width="5"/>
    <rect x="35" y="115" width="35" height="34" rx="6" fill="#dff6ff" stroke="#7e996e" stroke-width="5"/>
    <circle cx="170" cy="124" r="10" fill="#f3bc50"/>
  </g>

  <!-- right windmill silhouette -->
  <g transform="translate(790 1260)" opacity=".9">
    <rect x="-20" y="10" width="40" height="170" rx="14" fill="#a87544" stroke="#6b482d" stroke-width="5"/>
    <circle cx="0" cy="0" r="25" fill="#8c5b34" stroke="#603c26" stroke-width="5"/>
    <g fill="#f5ead0" stroke="#8a653d" stroke-width="5">
      <path d="M0 0 L20 -115 L-8 -118 L-12 -15Z"/>
      <path d="M0 0 L118 18 L115 -10 L15 -12Z"/>
      <path d="M0 0 L-20 115 L8 118 L12 15Z"/>
      <path d="M0 0 L-118 -18 L-115 10 L-15 12Z"/>
    </g>
  </g>

  <!-- pond bottom left -->
  <path d="M0 1250 C120 1185 250 1215 310 1300 C348 1354 326 1458 257 1514 C195 1564 80 1575 0 1546Z" fill="#4aafda" stroke="#2c8fbe" stroke-width="8"/>
  <path d="M18 1290 C120 1250 220 1266 278 1328 C235 1321 202 1338 172 1360 C122 1395 70 1385 25 1370Z" fill="#7ddbef" opacity=".55"/>
  <g fill="#6bbf58" stroke="#378b42" stroke-width="4">
    <ellipse cx="90" cy="1415" rx="38" ry="18"/>
    <ellipse cx="185" cy="1470" rx="34" ry="16"/>
  </g>
  <g fill="#a66f40" stroke="#70482d" stroke-width="5">
    <rect x="0" y="1325" width="175" height="30" rx="8"/>
    <rect x="20" y="1292" width="20" height="100" rx="6"/>
    <rect x="145" y="1292" width="20" height="100" rx="6"/>
  </g>

  <!-- main road -->
  <polyline points="310,390 790,390 790,1190 100,1190 100,470"
    fill="none" stroke="#3d9438" stroke-width="116" stroke-linecap="butt" stroke-linejoin="round"/>
  <polyline points="310,390 790,390 790,1190 100,1190 100,470"
    fill="none" stroke="#9c673a" stroke-width="98" stroke-linecap="butt" stroke-linejoin="round"/>
  <polyline points="310,390 790,390 790,1190 100,1190 100,470"
    fill="none" stroke="url(#path)" stroke-width="84" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- road texture -->
  <g fill="#be8248" opacity=".72">
    <ellipse cx="410" cy="405" rx="10" ry="4"/><ellipse cx="565" cy="374" rx="8" ry="3"/>
    <ellipse cx="730" cy="410" rx="11" ry="4"/><ellipse cx="810" cy="540" rx="4" ry="10"/>
    <ellipse cx="770" cy="705" rx="4" ry="9"/><ellipse cx="810" cy="870" rx="4" ry="11"/>
    <ellipse cx="770" cy="1050" rx="4" ry="10"/><ellipse cx="650" cy="1170" rx="10" ry="4"/>
    <ellipse cx="470" cy="1210" rx="9" ry="4"/><ellipse cx="300" cy="1170" rx="10" ry="4"/>
    <ellipse cx="128" cy="1080" rx="4" ry="10"/><ellipse cx="75" cy="880" rx="4" ry="10"/>
    <ellipse cx="125" cy="670" rx="4" ry="9"/><ellipse cx="75" cy="520" rx="4" ry="8"/>
  </g>

  <!-- empty playable board -->
  <rect x="212" y="490" width="476" height="594" rx="28" fill="#4b9b3e" opacity=".28" filter="url(#soft)"/>
  <rect x="222" y="480" width="456" height="594" rx="26" fill="url(#grid)" stroke="#57ad42" stroke-width="8"/>
  <path d="M238 496H662" stroke="#a5e171" stroke-width="6" stroke-linecap="round" opacity=".65"/>

  <!-- light decorative grass only inside board -->
  <g opacity=".9">
    <use href="#flower" transform="translate(270 555) scale(.85)"/>
    <use href="#flower" transform="translate(618 600) scale(.8)"/>
    <use href="#flower" transform="translate(318 840) scale(.72)"/>
    <use href="#flower" transform="translate(586 945) scale(.78)"/>
    <use href="#clover" transform="translate(355 635) scale(.55)"/>
    <use href="#clover" transform="translate(540 770) scale(.55)"/>
    <use href="#clover" transform="translate(420 1000) scale(.55)"/>
  </g>

  <!-- outside decorations -->
  <g>
    <use href="#bush" transform="translate(72 620) scale(.9)"/>
    <use href="#bush" transform="translate(835 600) scale(.9)"/>
    <use href="#bush" transform="translate(70 1020) scale(.95)"/>
    <use href="#bush" transform="translate(845 1010) scale(.9)"/>
    <use href="#flower" transform="translate(165 340)"/>
    <use href="#flower" transform="translate(735 325)"/>
    <use href="#flower" transform="translate(160 1115)"/>
    <use href="#flower" transform="translate(735 1100)"/>
    <use href="#flower" transform="translate(360 1310)"/>
    <use href="#flower" transform="translate(540 1370)"/>
  </g>

  <!-- stones outside playable board -->
  <g fill="#c7c3b5" stroke="#8f9180" stroke-width="4">
    <ellipse cx="178" cy="920" rx="16" ry="10" transform="rotate(-18 178 920)"/>
    <ellipse cx="732" cy="760" rx="16" ry="10" transform="rotate(12 732 760)"/>
    <ellipse cx="700" cy="1280" rx="19" ry="12" transform="rotate(-15 700 1280)"/>
    <ellipse cx="328" cy="1288" rx="15" ry="9"/>
  </g>

  <!-- cat platform -->
  <g transform="translate(58 410)" fill="#9a6439" stroke="#684126" stroke-width="6">
    <rect x="0" y="0" width="84" height="26" rx="9"/>
    <circle cx="18" cy="13" r="3" fill="#5f3b24" stroke="none"/>
    <circle cx="66" cy="13" r="3" fill="#5f3b24" stroke="none"/>
  </g>

  <!-- bottom flower border -->
  <g opacity=".95">
    <use href="#bush" transform="translate(360 1518) scale(1.1)"/>
    <use href="#bush" transform="translate(520 1528) scale(1.2)"/>
    <use href="#bush" transform="translate(700 1495) scale(1.1)"/>
    <use href="#flower" transform="translate(330 1478) scale(1.15)"/>
    <use href="#flower" transform="translate(610 1500) scale(1.1)"/>
    <use href="#flower" transform="translate(770 1438)"/>
  </g>
</svg>