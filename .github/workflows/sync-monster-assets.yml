name: Sync Approved Monster Assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-monster-assets.yml"
      - "main.js"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repo
        uses: actions/checkout@v4

      - name: Pull approved monster WebP assets from source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://raw.githubusercontent.com/BaiMaGod/luobotuwei/main/assets"
          for name in monster-normal monster-fast monster-tank monster-boss; do
            curl -L --fail --retry 3 "$base/$name.webp" -o "assets/$name.webp"
          done

      - name: Commit synced assets when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/monster-normal.webp assets/monster-fast.webp assets/monster-tank.webp assets/monster-boss.webp
          if git diff --cached --quiet; then
            echo "Monster assets already up to date."
            exit 0
          fi
          git commit -m "deploy: sync approved monster WebP assets"
          git push
