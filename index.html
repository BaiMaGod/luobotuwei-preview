<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8bcf55" />
  <title>萝卜突围</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" id="app">
    <section class="game-card" aria-label="萝卜突围游戏区域">
      <div id="game"></div>

      <header class="hud">
        <div class="hud-pill" id="lives" aria-label="生命值">❤️❤️❤️</div>
        <div class="hud-center">
          <strong id="levelLabel">第 1 关</strong>
          <span id="waveLabel">怪物 0 / 0</span>
        </div>
        <div class="hud-pill combo" id="comboLabel">COMBO ×0</div>
      </header>

      <div class="tutorial" id="tutorial">
        <span id="tutorialText">尖端就是方向，点击能直线飞出的萝卜！</span>
      </div>

      <div class="floating-message" id="floatingMessage" aria-live="polite"></div>

      <nav class="tools" aria-label="局内道具">
        <button class="tool-button" id="hammerButton" type="button">
          <span class="tool-icon">🔨</span>
          <span>移除</span>
          <b id="hammerCount">×1</b>
        </button>
        <button class="tool-button" id="freezeButton" type="button">
          <span class="tool-icon">❄️</span>
          <span>冰冻</span>
          <b id="freezeCount">×1</b>
        </button>
        <button class="tool-button" id="bombButton" type="button">
          <span class="tool-icon">💣</span>
          <span>炸弹</span>
          <b id="bombCount">×1</b>
        </button>
      </nav>

      <section class="modal hidden" id="resultModal" role="dialog" aria-modal="true">
        <div class="modal-card">
          <div class="result-icon" id="resultIcon">🌻</div>
          <h1 id="resultTitle">守住了！</h1>
          <p id="resultSubtitle">萝卜们成功挡住了怪潮</p>
          <div class="result-grid">
            <span>命中率</span><strong id="accuracyValue">0%</strong>
            <span>最高连击</span><strong id="bestComboValue">0</strong>
            <span>剩余生命</span><strong id="lifeValue">3</strong>
          </div>
          <button class="primary-button" id="primaryResultButton" type="button">下一关</button>
          <button class="secondary-button" id="retryButton" type="button">再来一次</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
  <!-- GitHub Pages deployment trigger -->
</body>
</html>
