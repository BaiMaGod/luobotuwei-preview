<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#78c94b" />
  <title>辣椒小猫咪</title>
  <link rel="stylesheet" href="././styles.css?v=quality-home-20261008" />
</head>
<body>
  <main class="app-shell" id="app">
    <section class="game-card" aria-label="辣椒小猫咪游戏区域">
      <div id="game"></div>
      <!-- Dedicated home screen: uses existing garden and cat sprites, not a gameplay popup. -->
      <section class="home-screen" id="homeScreen" aria-label="游戏首页">
        <div class="home-vignette" aria-hidden="true"></div>
        <div class="home-top">
          <div class="home-logo sprite-ui">
            <h1>辣椒小猫咪</h1>
            <span>方向解谜 · 果园保卫战</span>
          </div>
        </div>
        <div class="home-center">
          <div class="home-hero-art sprite-ui" role="img" aria-label="可爱小猫坐在木箱上"></div>
          <p class="home-slogan">看准方向，一脚踢飞！</p>
          <div class="home-guide" aria-label="玩法说明">
            <p><span class="home-guide-index">01</span> 看辣椒尖端，判断方向</p>
            <p><span class="home-guide-index">02</span> 点击前方没有阻挡的辣椒</p>
            <p><span class="home-guide-index">03</span> 留下最后一颗金椒清场</p>
          </div>
        </div>
        <div class="home-bottom">
          <button id="startGameButton" class="home-start" type="button">开始闯关 <span aria-hidden="true">➜</span></button>
          <p id="homeProgress" class="home-progress">第 1 关 · 首次守护果园</p>
          <button id="homeRestartButton" class="home-restart" type="button" hidden>从第 1 关开始</button>
          <div class="home-sound-tip" aria-hidden="true">音效可在游戏中随时关闭</div>
        </div>
      </section>


      <header class="hud">
        <div class="lives-board" id="lives" aria-label="生命值">
          <i class="life-heart"></i><i class="life-heart"></i><i class="life-heart"></i>
        </div>

        <div class="hud-center sprite-ui title-board">
          <div class="brand-text">辣椒小猫咪</div>
          <strong id="levelLabel">第 1 关</strong>
          <span id="waveLabel">辣椒 16 / 16 · 已击退 0</span>
        </div>

        <div class="combo-board sprite-ui" aria-hidden="true">
          <span id="comboLabel">×0</span>
        </div>
      </header>

      <div class="tutorial sprite-ui hidden" id="tutorial">
        <span id="tutorialText">看尖端，解开阻挡。最后一颗金色终结椒，碰到怪物直接秒杀！</span>
      </div>

      <div class="floating-message" id="floatingMessage" aria-live="polite"></div>

      <nav class="tools" aria-label="局内道具">
        <button class="tool-button tool-remove sprite-ui" id="hammerButton" type="button" aria-label="移除 x1">
          <span class="sr-only">移除</span><b class="sr-only" id="hammerCount">×1</b>
        </button>
        <button class="tool-button tool-freeze sprite-ui" id="freezeButton" type="button" aria-label="冰冻 x1">
          <span class="sr-only">冰冻</span><b class="sr-only" id="freezeCount">×1</b>
        </button>
        <button class="tool-button tool-bomb sprite-ui" id="bombButton" type="button" aria-label="炸弹 x1">
          <span class="sr-only">炸弹</span><b class="sr-only" id="bombCount">×1</b>
        </button>
      </nav>

      <button class="pause-trigger" id="pauseButton" type="button" aria-label="暂停游戏" aria-expanded="false" aria-controls="pauseOverlay">Ⅱ</button>
      <button class="mute-trigger" id="muteButton" type="button" aria-label="关闭音效" aria-pressed="false">♫</button>
      <section class="pause-overlay hidden" id="pauseOverlay" role="dialog" aria-modal="true" aria-label="游戏暂停">
        <div class="pause-panel">
          <div class="pause-art hud-center sprite-ui">
            <div class="brand-text">辣椒小猫咪</div>
            <strong>游戏暂停</strong>
          </div>
          <div class="pause-cat-art sprite-ui" aria-hidden="true"></div>
          <p>慢慢看清辣椒的方向，再一脚踢飞！</p>
          <button class="pause-action" id="resumeButton" type="button">继续游戏</button>
          <button class="pause-retry" id="pauseRetryButton" type="button">重玩本关</button>
          <button class="pause-home" id="pauseHomeButton" type="button">返回首页</button>
        </div>
      </section>
      <section class="modal hidden" id="resultModal" role="dialog" aria-modal="true">
        <div class="result-confetti" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="modal-card">
          <div class="result-kicker">关卡结算</div>

          <div class="result-hero" aria-hidden="true">
            <div class="result-crown">👑</div>
            <div class="result-icon-wrap">
              <div class="result-icon" id="resultIcon" role="img" aria-label="胜利小猫"></div>
            </div>
            <i class="hero-sparkle sparkle-a"></i>
            <i class="hero-sparkle sparkle-b"></i>
            <i class="hero-sparkle sparkle-c"></i>
          </div>

          <div class="result-title-ribbon">
            <h1 id="resultTitle">守住了！</h1>
          </div>

          <p class="result-subtitle">
            <span class="result-leaf" aria-hidden="true">🍃</span>
            <span id="resultSubtitle">怪椒退散，果园安全！</span>
            <span class="result-leaf" aria-hidden="true">🍃</span>
          </p>

          <div class="result-grid">
            <div class="result-stat" data-icon="target">
              <span>命中率</span><strong id="accuracyValue">0%</strong>
            </div>
            <div class="result-stat" data-icon="combo">
              <span>最高连击</span><strong id="bestComboValue">0</strong>
            </div>
            <div class="result-stat" data-icon="life">
              <span>剩余生命</span><strong id="lifeValue">3</strong>
            </div>
          </div>

          <button class="primary-button" id="primaryResultButton" type="button">下一关</button>
          <button class="secondary-button" id="retryButton" type="button">重玩本关</button>

          <div class="result-foliage result-foliage-left" aria-hidden="true"></div>
          <div class="result-foliage result-foliage-right" aria-hidden="true"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="./main.js?v=quality-home-20261008"></script>
</body>
</html>
